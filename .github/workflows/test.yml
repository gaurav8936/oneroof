# FALLBACK ONLY (CMN-ACTIONS-OFF W3, 2026-10-20): tests run on Woodpecker (.woodpecker/test.yaml on Linux,
# .woodpecker/test-mac.yaml on the owner's Mac). Run by hand only if Woodpecker is down. Deleted after the soak.
name: test (fallback only)
on:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: bash tests/run.sh
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -S warning bin/roof guard/*.sh lib/common.sh shell/oneroof.sh tools/sync-skills.sh tests/*.sh
  swift:
    # OneRoofCore unit tests. The app target needs the libghostty build (gitignored), so CI skips it (Package.swift).
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: swift --version
      - run: swift test
  roofd:
    # roofd (LAB-ROOFD): RoofVT is built from Ghostty v1.3.1's ghostty-vt module with zig 0.15, then the whole suite
    # runs: OneRoofCore + RoofdTests (a real daemon in a temp folder) + RoofVT's Zig tests. No libghostty app build.
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - run: brew install zig@0.15
      - run: git clone --depth 1 --branch v1.3.1 https://github.com/ghostty-org/ghostty.git "$RUNNER_TEMP/ghostty"
      - run: ONEROOF_GHOSTTY_DIR="$RUNNER_TEMP/ghostty" bash roofd/build-roofvt.sh
      - run: (cd roofd/RoofVT && /opt/homebrew/opt/zig@0.15/bin/zig build test --summary all)
      - run: swift test
